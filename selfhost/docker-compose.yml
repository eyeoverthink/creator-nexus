# creator-nexus self-hosted stack (Phase 1). Run from this directory: docker compose up -d --build
# Nothing is published on the public interface: web is bound to localhost (HTTPS on the tailnet comes
# from `tailscale serve`, see MIGRATION.md) and the API's 127.0.0.1:8787 is only for the systemd timers.
name: creator-nexus
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cn
      POSTGRES_DB: cn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cn -d cn"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: selfhost/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cn:${POSTGRES_PASSWORD}@db:5432/cn
      SELF_URL: http://127.0.0.1:8787
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:8787:8787"
  web:
    build:
      context: ..
      dockerfile: selfhost/web/Dockerfile
      args:
        VITE_CREATOR_NEXUS_URL: ${PUBLIC_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
volumes:
  pgdata:
  files:
