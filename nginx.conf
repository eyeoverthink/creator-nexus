server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy streaming API to Chandra-FRAYMUS minting pipeline
    location /api/streaming/ {
        proxy_pass http://172.17.0.1:8787/api/streaming/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Proxy overlay/demo pages from Chandra-FRAYMUS
    location /streaming/ {
        proxy_pass http://172.17.0.1:8787/streaming/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # WebSocket upgrade for OBS overlay
    location /ws/obs {
        proxy_pass http://172.17.0.1:8787/ws/obs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Proxy Base44 API calls (streaming routes above take priority)
    location /api/ {
        proxy_pass https://creator-nexus.base44.app/api/;
        proxy_set_header Host creator-nexus.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy Base44 functions
    location /functions/ {
        proxy_pass https://creator-nexus.base44.app/functions/;
        proxy_set_header Host creator-nexus.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy Base44 entities
    location /entities/ {
        proxy_pass https://creator-nexus.base44.app/entities/;
        proxy_set_header Host creator-nexus.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy Base44 auth
    location /auth/ {
        proxy_pass https://creator-nexus.base44.app/auth/;
        proxy_set_header Host creator-nexus.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
